<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentforce サクセスナビ | Salesforce ヘルプ集</title>
<style>
  :root{--navy:#032d60;--blue:#0176d3;--sky:#eaf5fe;--ink:#181818;--gray:#5c6670;--line:#e5eaf0;--bg:#f3f6fb;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
  header.top{background:linear-gradient(120deg,var(--navy),#014486);color:#fff;padding:26px 20px}
  header.top .wrap{max-width:960px;margin:0 auto}
  .crumb{font-size:12px;color:#bcd9f5;margin-bottom:10px}.crumb a{color:#bcd9f5}
  header.top h1{margin:0;font-size:26px}
  header.top p{margin:6px 0 0;font-size:14px;color:#e4f0fb}
  #sn-mode{display:none;margin-top:10px;font-size:11.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:3px 10px;border-radius:20px}
  main{max-width:960px;margin:0 auto;padding:22px 20px 60px}
  .sn-tabbar{display:flex;gap:8px;border-bottom:2px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
  .sn-tabbtn{background:none;border:none;font:inherit;font-size:15px;font-weight:700;color:var(--gray);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .sn-tabbtn:hover{color:var(--navy)}
  .sn-tabbtn.active{color:var(--blue);border-bottom-color:var(--blue)}
  .sn-panel{display:none}.sn-panel.active{display:block}
  .sn-lead{color:var(--gray);font-size:13.5px;margin:0 0 16px}
  .sn-grp{font-size:15px;color:var(--navy);margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .sn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  a.sn-card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink)}
  a.sn-card:hover{box-shadow:0 4px 14px rgba(3,45,96,.12);transform:translateY(-1px);text-decoration:none;transition:.15s}
  .sn-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--blue);background:rgba(1,118,211,.1);padding:2px 9px;border-radius:12px;margin-bottom:7px}
  a.sn-card h4{margin:0 0 5px;font-size:14.5px;color:var(--navy)}
  a.sn-card p{margin:0 0 7px;font-size:12.8px;color:var(--gray)}
  .sn-meta{font-size:11px;color:#8a94a0}
  ol.sn-steps{counter-reset:s;list-style:none;padding:0;margin:6px 0}
  ol.sn-steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-bottom:1px dashed var(--line)}
  ol.sn-steps li:last-child{border-bottom:none}
  ol.sn-steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  ol.sn-steps b{color:var(--navy)}ol.sn-steps span{font-size:13px;color:var(--gray)}
  footer{max-width:960px;margin:0 auto;padding:18px 20px;font-size:11.5px;color:var(--gray);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="crumb"><a href="../index.html">Salesforce ヘルプ集</a> &rsaquo; サクセスナビ &rsaquo; <span id="sn-crumb">Agentforce</span></div>
    <h1 id="sn-title">Agentforce サクセスナビ</h1>
    <p id="sn-sub"></p>
    <span id="sn-mode"></span>
  </div>
</header>
<main>
  <div id="sn-root"></div>
</main>
<footer>
  出典: Salesforce 公式サクセスナビ(successjp.salesforce.com) および help.salesforce.com。要点のみを日本語で整理した参考資料で、全文転載ではありません。最新情報は各公式ページをご確認ください。
  ／ 顧客に見せる場合は URL に <code>?mode=customer</code> を付けるとブログタブが非表示になります。
</footer>
<script src="data-agentforce.js"></script>
<script src="product.js"></script>
</body>
</html>
